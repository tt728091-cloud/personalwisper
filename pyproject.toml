[project]
name = "personalwisper"
version = "1.0.0"
description = "Local hold-to-talk dictation for macOS on Apple silicon, with a voice-driven to-do list."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub==2.2.0",
    "markdown-it-py==4.2.0",
    "mlx==0.32.4",
    "mlx-audio==0.6.2",
    "mlx-lm==0.32.0",
    "numpy==2.5.3",
    "parakeet-mlx==0.5.3",
    "pyobjc-framework-avfoundation==12.2.2",
    "pyobjc-framework-cocoa==12.2.2",
    "pyobjc-framework-quartz==12.2.2",
    "sounddevice==0.5.6",
    "websockets==17.3",
]

[tool.uv]
# An app folder, not an installable package.
package = false
# The exact versions PersonalWisper was tested with.
constraint-dependencies = [
